<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Artisan Goods</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Artisan Goods</h1>
            <p>Sign in to your account</p>
            
            <div id="user-profile" class="hidden">
                <img id="user-photo" src="" alt="Profile Photo">
                <h3 id="user-name"></h3>
                <p id="user-email"></p>
                <button id="logout-btn" class="secondary-btn">Sign Out</button>
            </div>

            <div id="auth-actions">
                <button id="google-signin-btn" class="google-btn">
                    <img src="[https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.svg](https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.svg)" alt="Google Logo">
                    Continue with Google
                </button>
                <p id="status-msg"></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK via CDN (Modular) -->
    <script type="module" src="auth.js"></script>
</body>
</html>
